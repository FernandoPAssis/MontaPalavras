<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo das Sílabas com Emojis</title>
    <!-- Vínculo com o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="confetti"></canvas>

    <header>

        <!-- Botão de Voltar ao Portal -->
        <div class="portal-nav-container">
            <a href="https://fernandopassis.github.io/Portal-principal/index.html" class="btn-voltar-portal">
                <span class="btn-icon">🏠</span>
                <span class="btn-text">Voltar ao Portal</span>
            </a>
        </div>


        <h1>🧩 Jogo das Sílabas</h1>
        <div class="controls">
            <label for="levelSelect"><b>Nível:</b></label>
            <select id="levelSelect">
                <option value="1">1. Sementinha (Fácil)</option>
                <option value="2">2. Aventureiro (Médio)</option>
                <option value="3">3. Mestre (3+ Sílabas)</option>
                <option value="4">4. Super Leitor (Dígrafos)</option>
                <option value="5">5. Gênio (Encontros Consonantais)</option>
            </select>
            <button id="btnNovasPalavras">🔄 Novas Palavras</button>
        </div>
    </header>

    <div class="game-container" id="gameContainer"></div>

    <!-- Vínculo com o arquivo JavaScript externo -->
    <script src="palavras.js"></script>
    <script src="script.js"></script>
</body>
</html>
